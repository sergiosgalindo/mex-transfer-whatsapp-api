services:
  whatsapp-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mex-transfer-whatsapp-api
    restart: unless-stopped
    environment:
      CODI_CORE_API_URL: ${CODI_CORE_API_URL:-http://host.docker.internal:8080}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      PHONE_NUMBER_ID: ${PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-verify-token-123}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v25.0}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "${APP_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
